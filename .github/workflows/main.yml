
name: Build and Deploy MovieTicketBooking

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  Build-Deploy:
    name: Build and Deploy to Production
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check project directory
        run: |
          pwd
          ls -la
          ls -la MovieTicketBooking
          find . -name pom.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: MovieTicketBooking/pom.xml

      - name: Build and Test
        working-directory: ./MovieTicketBooking
        run: mvn --batch-mode clean verify

      - name: Verify WAR file
        working-directory: ./MovieTicketBooking
        run: ls -lh target/MovieTicketBooking.war

      - name: Deploy WAR to Tomcat
        working-directory: ./MovieTicketBooking
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
        run: |
          test -f target/MovieTicketBooking.war

          curl --fail-with-body --silent --show-error \
            --user "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            --upload-file target/MovieTicketBooking.war \
            "$TOMCAT_HOST/manager/text/deploy?path=/MovieTicketBooking&update=true"

      - name: Deployment completed
        run: echo "MovieTicketBooking deployed successfully!"
